services:
  laravel:
    build:
      context: ..
      dockerfile: devops/Dockerfile
    container_name: laravel_php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ../:/var/www/html
    networks:
      - laravel_network
    environment:
      TZ: America/Guayaquil

  nginx:
    image: nginx:1.28-alpine
    container_name: laravel_nginx
    restart: unless-stopped
    depends_on:
      - laravel
    volumes:
      - ../:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - laravel_network
      - npm_network
    environment:
      TZ: America/Guayaquil

networks:
  laravel_network:
    driver: bridge

  npm_network:
    external: true
